[package]
name = "wyvern_py"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ndarray = { version = "0.17.2", features = ["rayon"] }
num-complex = "0.4.6"
num-traits = "0.2.19"
numpy = "0.29.0"
pyo3 = { version = "0.29.0", default-features = false, features = ["eyre"] }
pyo3-stub-gen = { version = "0.23.0", optional = true }
wyvern = { path = "../../wyvern", features = ["mimalloc"] }

[features]
extension-module = ["pyo3/extension-module"]
stub-gen = ["dep:pyo3-stub-gen"]

[[bin]]
name = "stub_gen"
path = "src/bin/stub_gen.rs"
required-features = ["stub-gen"]
doc = false

[lints]
workspace = true
