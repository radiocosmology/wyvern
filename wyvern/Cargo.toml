[package]
name = "wyvern"
version.workspace = true
edition.workspace = true
readme.workspace = true
description = "A fast Rust extension for various numerical array algorithms"
authors = ["Liam Gray <liam.gray@ubc.ca>"]
license = "GPL-3.0-or-later"
homepage = "https://github.com/ljgray/wyvern"
repository = "https://github.com/ljgray/wyvern"
documentation = "https://ljgray.github.io/wyvern/"
keywords = ["wyvern"]

[dependencies]
eyre = "0.6.12"
mimalloc = {version = "0.1.52", optional = true }
ndarray = { version = "0.17.2", features = ["rayon"] }
num-complex = "0.4.6"
num-traits = "0.2.19"
paste = "1.0.15"
puruspe = "0.4.4"
rayon = "1.12.0"

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "interpolate"
harness = false

[features]
mimalloc = ["dep:mimalloc"]

[lints]
workspace = true
