---
name: wyvern-benchmarks
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

jobs:
  check-benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # share cache across jobs
          shared-key: "ci-cache"
          # prevent cross-os issues
          prefix-key: "${{ runner.os }}-rust wv"
      - run: cargo bench
