---
name: wyvern-benchmarks
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always
  RAYON_NUM_THREADS: 8

jobs:
  check-benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: dtolnay/rust-toolchain@stable
      # - uses: Swatinem/rust-cache@v2
      #   with:
      #     # share cache across jobs
      #     shared-key: "ci-cache-${{ github.workflow }}"
      #     # prevent cross-os issues
      #     prefix-key: "${{ runner.os }}-rust"
      - uses: extractions/setup-just@v4
      - run: just bench
